services:

  db:
    image: postgres:18
    env_file:
      - .env.docker

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build: .

    env_file:
      - .env.docker

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    depends_on:
      db:
        condition: service_healthy


  api:
    build: .

    env_file:
      - .env.docker

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully


  worker:
    build: .

    env_file:
      - .env.docker

    command:
      [
        "python",
        "-m",
        "app.workers.auction_workers"
      ]

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data:
  redis_data: